name: Stop a Curio stack
description: >-
  Tear down the compose project a job started with start-stack. On a
  self-hosted runner, which keeps its workspace and Docker daemon between jobs,
  also hand the files the containers wrote back to the runner user and remove
  the CI images of other commits.

inputs:
  project:
    description: The compose project, e.g. curio-ci
    required: true

runs:
  using: composite
  steps:
    - name: 🧹 Tear down containers
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        docker compose -p "$PROJECT" down -v --remove-orphans || true
        docker ps -aq --filter "label=com.docker.compose.project=$PROJECT" | xargs -r docker rm -f

    # The containers run as root and write into the bind-mounted checkout,
    # which the runner user cannot clean otherwise. Every commit pulls a new
    # image of several GB, and the daemon is this runner's own, so the images
    # of other commits go; `docker image rm` without -f skips any still in use.
    - name: 🧹 Hand back root-owned files, remove old CI images (self-hosted)
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true
        repo="ghcr.io/${GITHUB_REPOSITORY,,}-ci"
        docker image ls "$repo" --format '{{.Repository}}:{{.Tag}}' \
          | { grep -v ":${GITHUB_SHA}\$" || true; } \
          | xargs -r docker image rm > /dev/null 2>&1 || true
        docker image prune -f > /dev/null 2>&1 || true
