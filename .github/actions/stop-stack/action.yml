name: Stop a Curio stack
description: >-
  Tear down the compose project a job started with start-stack. On a
  self-hosted runner, which keeps its workspace and Docker daemon between jobs,
  also hand the files the containers wrote back to the runner user and remove
  the CI images of other commits.

inputs:
  project:
    description: The compose project, e.g. curio-ci
    required: true

# Each step is one subcommand of scripts/ci_stack.sh, which the flake hunt's
# lanes (scripts/ci_lanes.py) call too.
runs:
  using: composite
  steps:
    - name: 🧹 Tear down containers
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: bash "$GITHUB_WORKSPACE/scripts/ci_stack.sh" down "$PROJECT"

    - name: 🧹 Hand back root-owned files, remove old CI images (self-hosted)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/ci_stack.sh" handback
