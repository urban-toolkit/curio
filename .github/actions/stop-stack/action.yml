name: Stop a Curio stack
description: >-
  Tear down the compose project a job started, with start-stack or from an
  image it built (test-gpu, test-gpu-stress). On a self-hosted runner, which
  keeps its workspace and Docker daemon between jobs, also hand the files the
  containers wrote back to the runner user, and remove the images and build
  cache CI jobs leave on that daemon.

inputs:
  project:
    description: The compose project, e.g. curio-ci
    required: true

runs:
  using: composite
  steps:
    - name: 🧹 Tear down containers
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        docker compose -p "$PROJECT" down -v --remove-orphans || true
        docker ps -aq --filter "label=com.docker.compose.project=$PROJECT" | xargs -r docker rm -f

    # The containers run as root and write into the bind-mounted checkout,
    # which the runner user cannot clean otherwise.
    #
    # Every commit brings an image of several GB, pulled by start-stack or
    # built by the job, and a self-hosted daemon keeps them all: an arcade
    # runner's daemon is its own, utk-gpu's is the host's, which the deployed
    # stacks share. So this removes what CI jobs leave there:
    # - each CI stack's image name, `curio-ci*-curio` (start-stack tags it,
    #   compose builds under it), which otherwise holds its last job's image
    #   for good, one per project;
    # - the pulled images of other commits (this commit's stays for the
    #   runner's next job of the same commit);
    # - untagged images no container uses;
    # - build cache no build has used for a day.
    # The deployed stacks' images and every image a container uses stay:
    # `docker image rm` without -f skips an image in use. The disk use before
    # and after goes to the job's log.
    - name: 🧹 Hand back root-owned files, remove old CI images (self-hosted)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true
        echo "Docker disk use before the cleanup:"
        docker system df || true
        docker image ls --format '{{.Repository}}:{{.Tag}}' \
          | { grep -E '^curio-ci(-[a-z-]+)?-curio:' || true; } \
          | xargs -r docker image rm > /dev/null 2>&1 || true
        repo="ghcr.io/${GITHUB_REPOSITORY,,}-ci"
        docker image ls "$repo" --format '{{.Repository}}:{{.Tag}}' \
          | { grep -v ":${GITHUB_SHA}\$" || true; } \
          | xargs -r docker image rm > /dev/null 2>&1 || true
        docker image prune -f > /dev/null 2>&1 || true
        docker builder prune -af --filter until=24h > /dev/null 2>&1 || true
        echo "Docker disk use after the cleanup:"
        docker system df || true
