name: Python from the CI image
description: >-
  Give the runner a virtual environment of Python 3.12 whose site-packages are
  a CI image's, which build-image builds with CURIO_CI_SETUP=1 so that it
  holds what `curio.py setup --with-examples` installs, and put its bin/ first
  on PATH (scripts/ci_image_python.sh). On an arcade runner the image's own
  folder is mounted there read-only, in place, and stop-stack lets it go;
  elsewhere, or when the mount does not come up, the packages are copied. The
  pytest a job runs on the runner then uses what the image installed, and
  `scripts/test.sh --skip-setup` installs nothing. The browser stays the
  runner's own Chrome, which the e2e suite launches
  (browser_type_launch_args in utk_curio/backend/tests/conftest.py); on a
  utk-desktop runner it draws with the fonts of ubuntu-latest. A virtual
  environment rather than the runner's own Python: on a self-hosted runner
  that Python keeps what earlier jobs installed, and it would be imported
  first. Writes only under RUNNER_TEMP and the runner's home, never the
  workspace, so the stack's container is still the first to create .curio/.

inputs:
  image:
    description: The CI image, already on this runner (pulled, or built by the job)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # Copied, the 9.2 GB of packages were 9.4 GB of disk writes per job, and a
    # run starts up to 15 such jobs on arcade at once, whose runners share one
    # disk: every disk write on arcade then waited up to 40 s (run
    # 42344025435). In place, an arcade job writes none of it.
    - name: 📦 The image's Python packages
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: bash "$GITHUB_WORKSPACE/scripts/ci_image_python.sh" take "$IMAGE"

    # The screenshot baselines are drawn with the fonts of ubuntu-latest, which
    # the arcade runners copy. A utk-desktop runner is an Ubuntu desktop, whose
    # fontconfig resolves sans-serif and system-ui to Noto Sans and Helvetica to
    # Nimbus Sans instead of DejaVu Sans and Liberation Sans, so text wraps
    # elsewhere and frames fail. Its jobs see only ubuntu-latest's font folders
    # (Noto only for color emoji); the desktop's own session keeps its fonts.
    - name: 🔤 The fonts of ubuntu-latest (utk-desktop runners)
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_NAME:-}" in utk-desktop-*) ;; *) exit 0 ;; esac
        conf="$RUNNER_TEMP/ubuntu-latest-fonts.conf"
        {
          echo '<?xml version="1.0"?>'
          echo '<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">'
          echo '<fontconfig>'
          for dir in dejavu lato liberation liberation2 noto; do
            if [ -d "/usr/share/fonts/truetype/$dir" ]; then
              echo "  <dir>/usr/share/fonts/truetype/$dir</dir>"
            fi
          done
          echo '  <selectfont>'
          echo '    <rejectfont><glob>/usr/share/fonts/truetype/noto/*</glob></rejectfont>'
          echo '    <acceptfont><glob>/usr/share/fonts/truetype/noto/NotoColorEmoji*</glob></acceptfont>'
          echo '  </selectfont>'
          echo "  <cachedir>$RUNNER_TEMP/fontconfig-cache</cachedir>"
          echo '  <include ignore_missing="yes">/etc/fonts/conf.d</include>'
          echo '</fontconfig>'
        } > "$conf"
        echo "FONTCONFIG_FILE=$conf" >> "$GITHUB_ENV"
        echo "sans-serif is now $(FONTCONFIG_FILE="$conf" fc-match sans-serif)"
