name: Start a Curio stack from the CI image
description: >-
  Pull the image build-image pushed for this commit, start it under a compose
  project, and wait until it is healthy. The overlays come from the job's
  COMPOSE_FILE, as they do for every other docker compose step. On a
  self-hosted runner the job's first step, before checkout, has already
  removed every curio-ci stack an earlier job left (`&reclaim` in the
  workflow).

inputs:
  image:
    description: The image build-image pushed (its `image` output)
    required: true
  project:
    description: The compose project, e.g. curio-ci
    required: true
  token:
    description: A token that can read packages (secrets.GITHUB_TOKEN)
    required: true
  timeout:
    description: Seconds to wait for the container to report healthy
    default: "300"
  seed:
    description: Shell run after the pull and before the stack starts
    default: ""
  runner-env:
    description: >-
      "true" to also give the runner the image's Python packages
      (./.github/actions/image-env), for a pytest run on the runner with
      scripts/test.sh --skip-setup. They are copied while the container boots.
    default: "false"

runs:
  using: composite
  steps:
    # A memory limit for the container, sized to what the runner has free, so
    # a stack that outgrows a small runner fails its job instead of swapping
    # the machine until the runner is lost (docker-compose.ci.yml). Hosted
    # runners keep none: test-desktop-stress measures a laptop without one.
    - name: 📏 Size the stack to the runner's free memory
      if: runner.environment == 'self-hosted'
      shell: bash
      run: python3 scripts/ci_memory_budget.py --github-env

    # A pulled image takes its size twice on disk, packed and unpacked. On a
    # GitHub-hosted runner the toolchains no CI job uses go while it is
    # pulled, and the step after the wait says how much room that left
    # (scripts/ci_disk.sh).
    - name: 📏 Free disk, and room for the image (GitHub-hosted)
      shell: bash
      run: |
        bash scripts/ci_disk.sh free "before the pull"
        bash scripts/ci_disk.sh drop-tools

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    # Tagged with the name compose gives the service's image, so `up` finds it
    # and builds nothing. stop-stack removes both names at the job's end.
    - name: 📥 Pull the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail
        started=$(date +%s)
        docker pull --quiet "$IMAGE"
        echo "Pulled in $(( $(date +%s) - started )) s, $(docker image inspect --format '{{.Size}}' "$IMAGE") bytes on this daemon"
        docker tag "$IMAGE" "$PROJECT-curio"

    - name: 🌱 Seed the workspace
      if: inputs.seed != ''
      shell: bash
      run: ${{ inputs.seed }}

    - name: ▶️ Start containers
      shell: bash
      run: docker compose -p "${{ inputs.project }}" up -d --no-build

    # Here rather than after the wait: the copy takes about as long as the
    # container's boot, so the two run side by side.
    - if: inputs.runner-env == 'true'
      uses: ./.github/actions/image-env
      with:
        image: ${{ inputs.image }}

    - name: 🧪 Wait for services to become healthy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        WAIT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        timeout "$WAIT" bash -euo pipefail -c '
          while true; do
            cid="$(docker compose -p "$PROJECT" ps -a -q curio | head -n1 || true)"
            if [[ -z "${cid}" ]]; then sleep 2; continue; fi
            state="$(docker inspect --format "{{.State.Status}}" "${cid}" 2>/dev/null || true)"
            health="$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}" "${cid}" 2>/dev/null || true)"
            if [[ "${health}" == "healthy" ]]; then echo "$PROJECT is healthy."; break; fi
            if [[ "${health}" == "no-healthcheck" && "${state}" == "running" ]]; then break; fi
            if [[ "${state}" == "exited" ]]; then
              echo "$PROJECT exited during startup. Logs:"
              docker compose -p "$PROJECT" logs --no-color --tail=200 curio || true
              exit 1
            fi
            sleep 2
          done
        ' || { echo "::error::$PROJECT did not become healthy in ${WAIT}s" >&2
               docker compose -p "$PROJECT" logs --no-color --tail=200 curio || true
               exit 1; }

    - name: 📏 Free disk once the unused toolchains are gone (GitHub-hosted)
      if: runner.environment == 'github-hosted'
      shell: bash
      run: bash scripts/ci_disk.sh wait-tools
