name: Start a Curio stack from the CI image
description: >-
  Pull the image build-image pushed for this commit, start it under a compose
  project, and wait until it is healthy. The overlays come from the job's
  COMPOSE_FILE, as they do for every other docker compose step.

inputs:
  image:
    description: The image build-image pushed (its `image` output)
    required: true
  project:
    description: The compose project, e.g. curio-ci
    required: true
  token:
    description: A token that can read packages (secrets.GITHUB_TOKEN)
    required: true
  timeout:
    description: Seconds to wait for the container to report healthy
    default: "300"
  seed:
    description: Shell run after the pull and before the stack starts
    default: ""

# Each step is one subcommand of scripts/ci_stack.sh, which the flake hunt's
# lanes (scripts/ci_lanes.py) call too.
runs:
  using: composite
  steps:
    # The flake hunt's stacks (curio-lane-*) go too: a hunt whose runner died
    # leaves several of them, about 3 GiB each, beside the next job.
    - name: 🧹 Remove stacks an earlier job left (self-hosted)
      if: runner.environment == 'self-hosted'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/ci_stack.sh" clean '^curio-(ci|lane)'

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: 📥 Pull the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PROJECT: ${{ inputs.project }}
      run: bash "$GITHUB_WORKSPACE/scripts/ci_stack.sh" pull "$IMAGE" "$PROJECT"

    - name: 🌱 Seed the workspace
      if: inputs.seed != ''
      shell: bash
      run: ${{ inputs.seed }}

    - name: ▶️ Start containers
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: bash "$GITHUB_WORKSPACE/scripts/ci_stack.sh" up "$PROJECT"

    - name: 🧪 Wait for services to become healthy
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        WAIT: ${{ inputs.timeout }}
      run: bash "$GITHUB_WORKSPACE/scripts/ci_stack.sh" wait "$PROJECT" "$WAIT"
