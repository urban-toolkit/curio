name: Publish to PyPI on Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and Upload to PyPI
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v6

    - name: 🐍 Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: 📦 Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '26'

    - name: 📁 Install and build urban-workflows frontend
      run: |
        npm install
        npm run build
      working-directory: ./utk_curio/frontend/urban-workflows

    - name: 🧪 Extract version from GitHub Release tag
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "Extracted version: $VERSION"
        echo "__version__ = \"$VERSION\"" > utk_curio/__init__.py

    - name: 📦 Install build backend
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel

    - name: 🧹 Clean previous builds
      run: rm -rf dist/ *.egg-info

    # The package leaves out the big catalog files that
    # utk_curio/backend/app/datasets/infrastructure/left_out_files.json lists;
    # a pip install downloads each from GitHub, at this commit, the first time
    # it needs it, and checks it against this record, which the package ships.
    - name: Record the files the package leaves out
      run: python scripts/record_left_out_files.py --commit "$GITHUB_SHA"

    - name: 🛠 Build sdist and wheel
      run: python -m build --no-isolation

    - name: Check wheel metadata
      run: |
          twine check dist/*

    - name: 📦 Debug Wheel Contents
      run: unzip -l dist/*.whl

    - name: Check every file fits PyPI's 100 MiB limit
      run: python scripts/check_dist_sizes.py dist

    - name: 🚀 Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.0
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: 📎 Upload artifacts to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
