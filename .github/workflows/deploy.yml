name: Deploy

# One-time setup:
#   1. Tailscale: create OAuth client (scope: auth_keys, tag: tag:ci).
#      Repo secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET
#   2. Tailscale ACL: tag:ci -> tag:curio-server:22
#   3. On the server, run:
#        sudo tailscale up --advertise-tags=tag:curio-server --ssh
#      The Tailscale device keeps its OS hostname `utk`.
#   4. SSH key: deploy user has the public key in
#      /home/deploy/.ssh/authorized_keys; private key is GH secret
#      DEPLOY_SSH_KEY.
#   5. On the server, set up two side-by-side checkouts:
#        sudo -iu deploy
#        git clone https://github.com/<you>/curio.git /srv/curio        # stable
#        git clone https://github.com/<you>/curio.git /srv/curio-dev   # test
#
#      Each job writes its checkout's docker-compose.site.yml (container
#      name, host ports and curio.py arguments), so the two stacks do not
#      collide: stable publishes 5002/8080, dev 5012/8090.
#
#   6. Self-hosted GPU CI runner (for .github/workflows/docker-compose.yml,
#      which runs ONLY on this box — the WebGPU compute examples 06/07 need
#      real hardware WebGPU that GitHub-hosted runners lack). On `utk`:
#        a. Verify the NVIDIA GPU is usable headless:
#             lspci | grep -E 'VGA|3D'; ls -l /dev/dri; nvidia-smi
#             vulkaninfo --summary   # must name the NVIDIA device, NOT llvmpipe
#        b. Install GPU userspace + browser (as root):
#             apt-get install -y vulkan-tools   # plus the NVIDIA driver + ICD
#             # google-chrome-stable — the e2e suite uses real system Chrome
#             # (conftest.py _find_system_chrome), not bundled Chromium.
#        c. Ensure the `deploy` user's env does NOT set VK_ICD_FILENAMES
#           (it would pin Mesa lavapipe -> software WebGPU and the run would
#           fail the CURIO_REQUIRE_HARDWARE_WEBGPU assertion).
#        d. Install the Actions runner as `deploy`, registered to this repo
#           with labels `gpu,curio`, in a runner group scoped to THIS repo
#           only, under systemd (recommended --ephemeral):
#             sudo -iu deploy
#             mkdir ~/actions-runner && cd ~/actions-runner
#             # download + ./config.sh --url https://github.com/urban-toolkit/curio \
#             #   --token <repo runner token> --labels gpu,curio --ephemeral
#        e. SECURITY (public repo + self-hosted): Settings -> Actions -> require
#           approval for ALL outside-collaborator/fork PRs; scope the runner
#           group to this repo. The workflow's `if:` guard already prevents the
#           job from running on fork PRs, so untrusted code never executes here.
#      The CI stack runs as `docker compose -p curio-ci` on remapped ports
#      (2020/5022/8100), fully isolated from the prod curio/curio-dev stacks.

on:
  push:
    branches: [main]
    # utk_curio/frontend/urban-workflows/src/tests/deployPaths.test.ts checks
    # that this list covers what the deployed image copies.
    paths:
      - 'utk_curio/**'
      - 'docs/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.deploy.yml'
      - '.github/workflows/deploy.yml'
      # Baked into the image (see Dockerfile runtime_base COPYs). Without
      # these, a commit that only touches the package catalog never triggers
      # a deploy and curio-dev keeps serving a stale `packages/` tree.
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'curio.py'
      - 'scripts/**'
      - 'packages/**'
      - 'datasets/**'
      - 'discovery/**'
      - 'models/**'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA). Leave empty to deploy the latest v* tag.'
        required: false
        default: ''
      target:
        description: 'Which stack(s) to deploy'
        type: choice
        options:
          - both
          - dev
          - stable
        default: both
        required: true

jobs:
  deploy-dev:
    # Runs on every push (matching the paths filter) AND on dispatches unless
    # target is stable-only, so dev tracks stable on full releases.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'dev'))
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment: dev
    steps:
      - uses: actions/checkout@v6

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H utk >> ~/.ssh/known_hosts

      - name: Deploy to curio-dev stack
        env:
          REF_INPUT: ${{ inputs.ref || '' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@utk \
            bash -s "$REF_INPUT" <<'EOF'
          set -euo pipefail
          ref="${1:-}"
          cd /srv/curio-dev
          git fetch --prune --tags origin
          # Reset the package catalog before checking out. Earlier builds
          # bind-mounted ./packages into the container, where
          # publish-catalog rewrites entries in place -- so this checkout can
          # hold container-authored edits. `git checkout --detach` carries
          # those forward (it only writes paths that differ between HEAD and
          # the target) and aborts outright when an incoming commit touches a
          # locally-modified file. Scoped to packages/ on purpose: a bare
          # `git clean -fd` here would delete .env, instance/, .curio/ and
          # published datasets/, all untracked by design.
          git checkout -- packages/ 2>/dev/null || true
          git clean -fdq packages/ || true
          if [ -z "$ref" ]; then
            ref="main"
          fi
          git checkout --detach "origin/$ref" 2>/dev/null \
            || git checkout --detach "$ref"
          echo "Deploying $ref ($(git rev-parse --short HEAD))"
          # The site file replaces the published ports with `!override`, which
          # Docker Compose reads from 2.24.4 on. Checked before the running
          # stack is touched.
          compose_version="$(docker compose version --short)"
          if [ "$(printf '%s\n' 2.24.4 "$compose_version" | sort -V | head -n1)" != 2.24.4 ]; then
            echo "::error::Docker Compose $compose_version is older than 2.24.4, which docker-compose.site.yml needs"
            exit 1
          fi
          # This stack's container name, host ports and curio.py arguments
          # (docker-compose.deploy.yml). The backend is /api on whichever host
          # serves the page, so the stack needs no hostname of its own.
          cat > docker-compose.site.yml <<'SITE'
          services:
            curio:
              container_name: curio-dev
              ports: !override ["5012:5002", "8090:8080"]
              command: ["--backend-url", "/api"]
          SITE
          export COMPOSE_FILE=docker-compose.yml:docker-compose.deploy.yml:docker-compose.site.yml
          # Build while the old stack still serves: the site is offline only
          # from `down` until the new container boots, and a failed build
          # leaves the old stack up. The image's COPY datasets/ therefore runs
          # before the wipe below and carries the datasets accounts published;
          # the ./datasets bind mount hides that copy, and the image stays here.
          docker compose -p curio-dev build --no-cache
          echo "=== stopping the old stack ==="
          docker compose -p curio-dev down --remove-orphans --timeout 30 2>/dev/null || true
          # A container from an earlier convention / manual run keeps itself alive
          # via restart:unless-stopped and can hold the published ports, so a
          # freshly built image never actually serves. Force-remove it by name.
          docker rm -f curio-dev 2>/dev/null || true
          # curio-dev starts empty on every deploy, so no database row outlives
          # its files: accounts and projects (instance/), every account's stores
          # (.curio/), and the datasets accounts published into the shared
          # catalog (datasets/ entries git does not track; the shipped ones are
          # tracked). The container wrote them as root, hence the alpine rm.
          published="$(git ls-files --others --directory -- datasets)"
          docker run --rm -v "$PWD:/work" -w /work alpine rm -rf instance .curio $published
          mkdir -p instance .curio
          docker compose -p curio-dev up -d --force-recreate --remove-orphans
          # Wait for the container to report healthy, and FAIL if it does not.
          #
          # `up -d` returns as soon as the container is created, so every check
          # below used to run against a stack that might never have served a
          # request. That was survivable while a bad boot was unlikely; it is
          # not now that the deploy pins CURIO_ISOLATION=fork, which is fail-closed:
          # a sandbox that cannot confine exits rather than serve, and without
          # this gate the deploy would go green over a dead stack.
          #
          # The image's HEALTHCHECK has --start-period=180s (it curls backend,
          # sandbox and frontend), so allow generously more than that.
          echo "=== waiting for health ==="
          deadline=$((SECONDS + 420))
          while true; do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' curio-dev 2>/dev/null || echo missing)"
            state="$(docker inspect -f '{{.State.Status}}' curio-dev 2>/dev/null || echo missing)"
            if [ "$health" = "healthy" ]; then
              echo "healthy"
              break
            fi
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "::error::the stack exited during startup (state=$state)"
              docker compose -p curio-dev logs --no-color --tail=200 curio || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the stack never became healthy (state=$state health=$health)"
              docker compose -p curio-dev logs --no-color --tail=200 curio || true
              exit 1
            fi
            sleep 5
          done
          # When each server started, against "stopping the old stack" above:
          # the site shows nothing until the frontend server is up.
          echo "=== boot timeline ==="
          docker logs -t curio-dev 2>&1 \
            | grep -E "Starting (all|backend|sandbox|frontend)|Frontend server started" || true
          # Isolation is fail-closed, so a healthy stack has already proved
          # it came up isolated. Assert it anyway: a stack booted WITHOUT
          # the deploy overlay would have neither auth nor isolation and
          # would still be perfectly healthy, which is exactly the
          # regression worth catching.
          #
          # Ask the sandbox, do not grep the logs. The startup banner goes
          # to the sandbox subprocess's stderr, which curio.py routes into
          # .curio/messages.log, so `docker compose logs` carries only the
          # launcher's own output. The grep this replaces could therefore
          # never match, and passed silently on every deploy. /version
          # reports the mode the sandbox actually resolved, which is the
          # question being asked, and it is the same answer the UI badge
          # shows.
          #
          # Port 2000 is deliberately not published (it executes user
          # code), so reach it from inside the container. curl is present:
          # the image's HEALTHCHECK uses it.
          #
          # `< /dev/null` is load-bearing. This whole script is fed to the
          # remote shell as `bash -s` on STDIN, and `docker compose exec -T`
          # forwards ITS stdin to the container, so without the redirect it
          # swallows the rest of the script: bash hits EOF, exits 0, and
          # every step below here silently never runs.
          echo "=== node execution isolation ==="
          version_json="$(docker compose -p curio-dev exec -T curio \
                            curl -sf http://127.0.0.1:2000/version 2>/dev/null < /dev/null \
                          | tr -d ' \r\n' || true)"
          case "$version_json" in
            *'"isolation":"fork"'*)
              echo "OK: node execution is isolated (fork)"
              ;;
            *)
              echo "::error::the deployed stack is NOT isolated. /version said: ${version_json:-nothing}. Node code would run in-process with the sandbox's own privileges."
              docker run --rm -v "$PWD:/w" -w /w alpine sh -c \
                'grep -i isolation .curio/messages.log 2>/dev/null | tail -20' || true
              docker compose -p curio-dev logs --no-color --tail=100 curio || true
              exit 1
              ;;
          esac

          echo "=== docker ps (post-deploy) ==="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.RunningFor}}\t{{.Ports}}\t{{.Status}}' || true
          echo "=== serving container ==="
          docker inspect -f 'name={{.Name}} image={{.Config.Image}} imageId={{.Image}} created={{.Created}} restart={{.HostConfig.RestartPolicy.Name}}' curio-dev 2>/dev/null || true
          EOF

  deploy-stable:
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'stable')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-stable
      cancel-in-progress: false
    environment: stable
    steps:
      - uses: actions/checkout@v6

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H utk >> ~/.ssh/known_hosts

      - name: Deploy to stable stack
        env:
          REF_INPUT: ${{ inputs.ref || '' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@utk \
            bash -s "$REF_INPUT" <<'EOF'
          set -euo pipefail
          ref="${1:-}"
          cd /srv/curio
          git fetch --prune --tags origin
          # Reset the package catalog before checking out. Earlier builds
          # bind-mounted ./packages into the container, where
          # publish-catalog rewrites entries in place -- so this checkout can
          # hold container-authored edits. `git checkout --detach` carries
          # those forward (it only writes paths that differ between HEAD and
          # the target) and aborts outright when an incoming commit touches a
          # locally-modified file. Scoped to packages/ on purpose: a bare
          # `git clean -fd` here would delete .env, instance/, .curio/ and
          # published datasets/, all untracked by design.
          git checkout -- packages/ 2>/dev/null || true
          git clean -fdq packages/ || true
          if [ -z "$ref" ]; then
            ref=$(git describe --tags --abbrev=0 --match 'v*' origin/main)
          fi
          git checkout --detach "origin/$ref" 2>/dev/null \
            || git checkout --detach "$ref"
          echo "Deploying $ref ($(git rev-parse --short HEAD))"
          mkdir -p instance .curio
          export COMPOSE_FILE=docker-compose.yml:docker-compose.deploy.yml
          set -a; [ -f .env ] && . ./.env; set +a
          # v0.16.0 bakes its backend address into the bundle. Set after .env so
          # an older address there cannot win.
          export BACKEND_URL=https://flow.urbantk.org/api
          # Build while the old stack still serves: the site is offline only
          # from `down` until the new container boots, and a failed build
          # leaves the old stack up.
          docker compose -p curio build --no-cache
          echo "=== stopping the old stack ==="
          docker compose -p curio down --remove-orphans --timeout 30 2>/dev/null || true
          # A container from an earlier convention / manual run keeps itself alive
          # via restart:unless-stopped and can hold the published ports, so a
          # freshly built image never actually serves. Force-remove it by name.
          docker rm -f "${CURIO_CONTAINER_NAME:-curio}" 2>/dev/null || true
          docker compose -p curio up -d --force-recreate --remove-orphans
          # Wait for the container to report healthy, and FAIL if it does not.
          #
          # `up -d` returns as soon as the container is created, so every check
          # below used to run against a stack that might never have served a
          # request. That was survivable while a bad boot was unlikely; it is
          # not now that the deploy pins CURIO_ISOLATION=fork, which is fail-closed:
          # a sandbox that cannot confine exits rather than serve, and without
          # this gate the deploy would go green over a dead stack.
          #
          # The image's HEALTHCHECK has --start-period=180s (it curls backend,
          # sandbox and frontend), so allow generously more than that.
          echo "=== waiting for health ==="
          deadline=$((SECONDS + 420))
          while true; do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CURIO_CONTAINER_NAME:-curio}" 2>/dev/null || echo missing)"
            state="$(docker inspect -f '{{.State.Status}}' "${CURIO_CONTAINER_NAME:-curio}" 2>/dev/null || echo missing)"
            if [ "$health" = "healthy" ]; then
              echo "healthy"
              break
            fi
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "::error::the stack exited during startup (state=$state)"
              docker compose -p curio logs --no-color --tail=200 curio || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the stack never became healthy (state=$state health=$health)"
              docker compose -p curio logs --no-color --tail=200 curio || true
              exit 1
            fi
            sleep 5
          done
          # When each server started, against "stopping the old stack" above:
          # the site shows nothing until the frontend server is up.
          echo "=== boot timeline ==="
          docker logs -t "${CURIO_CONTAINER_NAME:-curio}" 2>&1 \
            | grep -E "Starting (all|backend|sandbox|frontend)|Frontend server started" || true
          # Isolation is fail-closed, so a healthy stack has already proved
          # it came up isolated. Assert it anyway: a stack booted WITHOUT
          # the deploy overlay would have neither auth nor isolation and
          # would still be perfectly healthy, which is exactly the
          # regression worth catching.
          #
          # Ask the sandbox, do not grep the logs. The startup banner goes
          # to the sandbox subprocess's stderr, which curio.py routes into
          # .curio/messages.log, so `docker compose logs` carries only the
          # launcher's own output. The grep this replaces could therefore
          # never match, and passed silently on every deploy. /version
          # reports the mode the sandbox actually resolved, which is the
          # question being asked, and it is the same answer the UI badge
          # shows.
          #
          # Port 2000 is deliberately not published (it executes user
          # code), so reach it from inside the container. curl is present:
          # the image's HEALTHCHECK uses it.
          #
          # `< /dev/null` is load-bearing. This whole script is fed to the
          # remote shell as `bash -s` on STDIN, and `docker compose exec -T`
          # forwards ITS stdin to the container, so without the redirect it
          # swallows the rest of the script: bash hits EOF, exits 0, and
          # every step below here silently never runs.
          echo "=== node execution isolation ==="
          version_json="$(docker compose -p curio exec -T curio \
                            curl -sf http://127.0.0.1:2000/version 2>/dev/null < /dev/null \
                          | tr -d ' \r\n' || true)"
          case "$version_json" in
            *'"isolation":"fork"'*)
              echo "OK: node execution is isolated (fork)"
              ;;
            *)
              echo "::error::the deployed stack is NOT isolated. /version said: ${version_json:-nothing}. Node code would run in-process with the sandbox's own privileges."
              docker run --rm -v "$PWD:/w" -w /w alpine sh -c \
                'grep -i isolation .curio/messages.log 2>/dev/null | tail -20' || true
              docker compose -p curio logs --no-color --tail=100 curio || true
              exit 1
              ;;
          esac

          echo "=== docker ps (post-deploy) ==="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.RunningFor}}\t{{.Ports}}\t{{.Status}}' || true
          echo "=== serving container ==="
          docker inspect -f 'name={{.Name}} image={{.Config.Image}} imageId={{.Image}} created={{.Created}} restart={{.HostConfig.RestartPolicy.Name}}' "${CURIO_CONTAINER_NAME:-curio}" 2>/dev/null || true
          EOF
