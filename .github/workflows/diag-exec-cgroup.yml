name: Diag exec cgroup memory

# A one-off probe for SideSeeing step 9.6.1: what a container started as
# deploy.yml and CI start it may do with cgroups on each kind of runner, and
# SAM 3's resident peak in a node cgroup on utk. Delete its runs when done.
# Round 1 (run 42708730576) probed every kind of runner, round 2 (run
# 42712931203) ran SAM 3 to the end on utk; this round asks whether removed node
# cgroups linger while the page cache they charged lives, per kernel.
on:
  push:
    branches: [diag/exec-cgroup-memory]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: utk, runs_on: '["self-hosted","utk","gpu"]' }
          - { name: arcade-cpu, runs_on: '["self-hosted","arcade","cpu"]' }
          - { name: hosted, runs_on: '"ubuntu-latest"' }
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 30
    env:
      PROBE_NAME: ${{ matrix.name }}
    steps:
      - name: Reclaim root-owned files an earlier job left (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true
          if [ -d .git ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            rm -f .git/info/sparse-checkout || true
          fi

      - uses: actions/checkout@v6

      - name: Removed cgroups and their page cache
        shell: bash
        run: bash diag/exec-cgroup/dying_host.sh 2>&1 | tee dying.log || true
