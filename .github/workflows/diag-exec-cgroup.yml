name: Diag exec cgroup memory

# A one-off probe for SideSeeing step 9.6.1: what a container started as
# deploy.yml and CI start it may do with cgroups on each kind of runner, and
# SAM 3's resident peak in a node cgroup on utk. Delete its runs when done.
# Round 1 (run 42708730576) probed every kind of runner; this round runs SAM 3
# to the end on shorter parts of the walk, on utk alone.
on:
  push:
    branches: [diag/exec-cgroup-memory]

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: utk, runs_on: '["self-hosted","utk","gpu"]', gpu: "1", gib: "20", sam3: "1" }
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 90
    env:
      PROBE_NAME: ${{ matrix.name }}
      PROBE_GPU: ${{ matrix.gpu }}
      PROBE_GPU_GIB: ${{ matrix.gib }}
    steps:
      - name: Reclaim root-owned files an earlier job left (self-hosted)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true
          if [ -d .git ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            rm -f .git/info/sparse-checkout || true
          fi

      - uses: actions/checkout@v6

      - name: SAM 3 to the end on shorter parts of the walk (utk)
        if: matrix.sam3 == '1'
        shell: bash
        run: bash diag/exec-cgroup/sam3_short.sh 2>&1 | tee sam3.log || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag-exec-cgroup-${{ matrix.name }}-round2
          path: sam3.log
          if-no-files-found: ignore
          retention-days: 7
