name: Bump version

on:
  push:
    branches: [main]
    paths:
      - 'utk_curio/**'
      - 'docs/examples/**'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (minor = feature release)"
        type: choice
        options:
          - patch
          - minor
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this is a version bump commit
        run: |
          MSG=$(git log -1 --format="%s")
          if [[ "$MSG" == chore:\ bump\ version\ to\ * ]]; then
            echo "SKIP=true" >> $GITHUB_ENV
          fi

      - name: Decide bump type
        if: env.SKIP != 'true'
        run: |
          # GitHub Models (which used to classify the release as minor/patch)
          # was retired on 2026-07-30, so the bump type is now explicit:
          # pushes to main bump PATCH, and a feature release is cut
          # deliberately via Run workflow -> bump: minor.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump }}"
          else
            BUMP="patch"
          fi
          echo "BUMP=$BUMP" >> $GITHUB_ENV
          echo "Bump type: $BUMP (trigger: ${{ github.event_name }})"

      - name: Bump version
        if: env.SKIP != 'true'
        run: |
          NEW_VERSION=$(BUMP="${{ env.BUMP }}" python3 <<'PYEOF'
          import os, re, pathlib
          p = pathlib.Path('utk_curio/__init__.py')
          text = p.read_text()
          current = re.search(r'__version__\s*=\s*["\'](.+?)["\']', text).group(1)
          parts = list(map(int, current.split('.')))
          if os.environ['BUMP'] == 'minor':
              parts[1] += 1
              parts[2] = 0
          else:
              parts[2] += 1
          new = '.'.join(map(str, parts))
          p.write_text(re.sub(r'''__version__\s*=\s*["'].*?["']''', f'__version__ = "{new}"', text))
          print(new)
          PYEOF
          )
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add utk_curio/__init__.py
          git commit -m "chore: bump version to $NEW_VERSION"
          git push
