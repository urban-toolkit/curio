name: Bump version

# A merge to main that changes what the deployed image holds bumps the patch
# version and dispatches deploy.yml for curio-dev, so each merge deploys once,
# on its bump commit.
on:
  push:
    branches: [main]
    # utk_curio/frontend/urban-workflows/src/tests/deployPaths.test.ts checks
    # that this list covers what the deployed image copies.
    paths:
      - 'utk_curio/**'
      - 'docs/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.deploy.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/bump-version.yml'
      # Baked into the image (see Dockerfile runtime_base COPYs). Without
      # these, a commit that only touches the package catalog never triggers
      # a deploy and curio-dev keeps serving a stale `packages/` tree.
      - 'requirements.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'curio.py'
      - 'scripts/**'
      - 'agents/**'
      - 'skills/**'
      - 'packages/**'
      - 'datasets/**'
      - 'discovery/**'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (minor/major = release: tags and deploys to stable)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip a push of a version bump commit
        run: |
          # Only a push can be a bump commit re-triggering this workflow. A
          # dispatched release runs on main, whose head is almost always the
          # last patch bump, so it must never skip.
          MSG=$(git log -1 --format="%s")
          if [[ "${{ github.event_name }}" == "push" && "$MSG" == chore:\ bump\ version\ to\ * ]]; then
            echo "SKIP=true" >> $GITHUB_ENV
          fi

      - name: Decide bump type
        if: env.SKIP != 'true'
        run: |
          # GitHub Models (which used to classify the release as minor/patch)
          # was retired on 2026-07-30, so the bump type is now explicit:
          # pushes to main bump PATCH, and a minor/major release is cut
          # deliberately via Run workflow -> bump: minor|major.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump }}"
          else
            BUMP="patch"
          fi
          echo "BUMP=$BUMP" >> $GITHUB_ENV
          echo "Bump type: $BUMP (trigger: ${{ github.event_name }})"

      # Two merges close together start two runs, and the later push is
      # rejected as non-fast-forward. Both bumps rewrite the same line, so a
      # rebase would conflict: each try starts again from main as it is now,
      # which also holds the other run's bump.
      - name: Bump version
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            BUMP="${{ env.BUMP }}" python3 - > "$RUNNER_TEMP/new-version" <<'PYEOF'
          import os, re, pathlib
          p = pathlib.Path('utk_curio/__init__.py')
          text = p.read_text()
          current = re.search(r'__version__\s*=\s*["\'](.+?)["\']', text).group(1)
          parts = list(map(int, current.split('.')))
          if os.environ['BUMP'] == 'major':
              parts[0] += 1
              parts[1] = 0
              parts[2] = 0
          elif os.environ['BUMP'] == 'minor':
              parts[1] += 1
              parts[2] = 0
          else:
              parts[2] += 1
          new = '.'.join(map(str, parts))
          p.write_text(re.sub(r'''__version__\s*=\s*["'].*?["']''', f'__version__ = "{new}"', text))
          print(new)
          PYEOF
            NEW_VERSION=$(cat "$RUNNER_TEMP/new-version")
            git add utk_curio/__init__.py
            git commit --quiet -m "chore: bump version to $NEW_VERSION"
            if git push origin HEAD:main; then
              echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
              exit 0
            fi
            echo "main moved during try $attempt; bumping again from the new main"
            sleep $((attempt * 5))
          done
          echo "::error::main kept moving: the bump was not pushed after 5 tries"
          exit 1

      - name: Tag and deploy minor/major releases
        if: env.SKIP != 'true' && (env.BUMP == 'minor' || env.BUMP == 'major')
        run: |
          # A minor/major release is already a deliberate act
          # (workflow_dispatch), so ship it: tag the bump commit and dispatch
          # the Deploy workflow to deploy that tag to both stacks. Pushes made
          # with GITHUB_TOKEN never trigger workflows, but workflow_dispatch
          # events are exempt from that recursion guard, so this needs no PAT.
          git tag "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          curl -sS -f -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"ref\":\"v${NEW_VERSION}\",\"target\":\"both\"}}"
          echo "Tagged v${NEW_VERSION} and dispatched Deploy (stable + dev)."

      - name: Redeploy dev on patch bumps
        if: env.SKIP != 'true' && env.BUMP == 'patch'
        run: |
          # Keep curio-dev on the exact released version: the patch-bump
          # commit is pushed with GITHUB_TOKEN (which triggers no workflows),
          # so dispatch a dev-only Deploy explicitly. Stable is untouched.
          curl -sS -f -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"ref":"main","target":"dev"}}'
          echo "Dispatched dev-only Deploy for the patch bump."

      # Deploy dispatches only from here, so a bump that failed must not leave
      # curio-dev on an older main.
      - name: Deploy dev even when the bump failed
        if: failure() && env.SKIP != 'true'
        run: |
          curl -sS -f -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"ref":"main","target":"dev"}}'
          echo "The bump failed; dispatched a dev-only Deploy of main anyway."
