name: Diag rerun memory flake

# Diagnostic only, on a tmp branch that is never merged. This round: the two
# sandbox test files of the fix's tree and of the before-run's tree (main plus
# only the tests), run inside main's CI image on ubuntu-latest, before the PR
# run and the before-run, so a mistake in a new test does not cost a full run.
on:
  push:
    branches: ["tmp/rerun-memory-probe"]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/urban-toolkit/curio-ci:a18707561b12afdc72ac779357a1bd5099516163

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tree: [tmp/rerun-memory-flake-check, tmp/rerun-memory-flake-before]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.tree }}
          path: tree

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        run: docker pull --quiet "$IMAGE"

      - name: The two sandbox test files
        run: |
          git -C tree log -1 --format='tree %h %s'
          docker run --rm -v "$GITHUB_WORKSPACE/tree:/src" -w /src -e PYTHONPATH=/src \
            -e CURIO_ISOLATION=off "$IMAGE" \
            python -m pytest utk_curio/sandbox/tests/test_memory_release.py \
              utk_curio/sandbox/tests/test_rerun_memory.py -v -p no:cacheprovider -rA \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
