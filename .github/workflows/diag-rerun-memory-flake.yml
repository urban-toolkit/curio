name: Diag rerun memory flake

# Diagnostic only, on a tmp branch that is never merged. Replays #408's
# dataflow inside main's CI images, on ubuntu-latest as the unit (sandbox)
# job does, and records what the replay's sandbox keeps at rest
# (.github/diag/rerun_memory_probe.py). This round: the cost of glibc's fixed
# thresholds, every setting on the same runner, interleaved.
on:
  push:
    branches: ["tmp/rerun-memory-probe"]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/urban-toolkit/curio-ci:a18707561b12afdc72ac779357a1bd5099516163

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        run: docker pull --quiet "$IMAGE"

      - name: Machine
        run: nproc; free -m; lscpu | grep -E "Model name|^CPU\(s\)"; uname -r

      - name: Allocation bench, interleaved
        if: ${{ false }}
        run: |
          base="-e MALLOC_ARENA_MAX=16 -e ARROW_DEFAULT_MEMORY_POOL=system"
          for round in 1 2 3; do
            for setting in none mmap4m mmap32m_trim8m mmap8m_trim16m; do
              case $setting in
                none) extra="" ;;
                mmap4m) extra="-e MALLOC_MMAP_THRESHOLD_=4194304 -e MALLOC_TRIM_THRESHOLD_=8388608" ;;
                mmap32m_trim8m) extra="-e MALLOC_MMAP_THRESHOLD_=33554432 -e MALLOC_TRIM_THRESHOLD_=8388608" ;;
                mmap8m_trim16m) extra="-e MALLOC_MMAP_THRESHOLD_=8388608 -e MALLOC_TRIM_THRESHOLD_=16777216" ;;
              esac
              echo "round $round $setting"
              docker run --rm -v "$GITHUB_WORKSPACE/.github/diag:/diag:ro" $base $extra "$IMAGE" \
                python /diag/alloc_bench.py | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: Replays, interleaved
        run: |
          mkdir -p out
          n=0
          for variant in launch launch_mmap32m_trim8m launch_mmap32m_trim8m launch launch launch_mmap32m_trim8m; do
            n=$((n + 1))
            docker run --rm -v "$GITHUB_WORKSPACE/.github/diag:/diag:ro" -v "$GITHUB_WORKSPACE/out:/out" \
              -e CURIO_ISOLATION=off -e FLASK_USE_RELOADER=0 -e CURIO_LAUNCH_CWD=/app -w /app "$IMAGE" \
              python /diag/rerun_memory_probe.py --variant "$variant" --label "order$n" \
                --samples 1 --cycles 10 --out "/out/bench${{ matrix.job }}-$n-$variant.json" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-${{ matrix.job }}
          path: out
          retention-days: 7
