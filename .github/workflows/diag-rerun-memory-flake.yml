name: Diag rerun memory flake

# Diagnostic only, on a tmp branch that is never merged. Replays #408's
# dataflow inside main's CI images, on ubuntu-latest as the unit (sandbox)
# job does, and records what the replay's sandbox keeps at rest
# (.github/diag/rerun_memory_probe.py).
on:
  push:
    branches: ["tmp/rerun-memory-probe"]

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: named, image: a18707561b12afdc72ac779357a1bd5099516163, variant: baseline, job: 1, diag: "--diag --decorate", samples: 2 }
          - { label: named, image: a18707561b12afdc72ac779357a1bd5099516163, variant: launch, job: 1, diag: "--diag --decorate", samples: 2 }
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        run: docker pull --quiet "ghcr.io/urban-toolkit/curio-ci:${{ matrix.image }}"

      - name: Machine and image
        run: |
          nproc; free -m; lscpu | grep -E "Model name|^CPU\(s\)"; uname -r
          for f in enabled defrag khugepaged/max_ptes_none khugepaged/defrag shmem_enabled; do
            echo "thp $f: $(cat /sys/kernel/mm/transparent_hugepage/$f 2>&1)"; done
          for f in /sys/kernel/mm/transparent_hugepage/hugepages-*/enabled; do echo "mthp $f: $(cat $f)"; done
          grep -E "AnonHugePages|ShmemHugePages" /proc/meminfo
          docker run --rm "ghcr.io/urban-toolkit/curio-ci:${{ matrix.image }}" sh -c '
            ldd --version | head -1
            python -c "import pyarrow as pa; print(\"pyarrow\", pa.__version__, pa.default_memory_pool().backend_name)"
            ARROW_DEFAULT_MEMORY_POOL=system python -c "import pyarrow as pa; print(\"with system:\", pa.default_memory_pool().backend_name)"
            python -c "import pandas, numpy, geopandas, shapely, duckdb; print(pandas.__version__, numpy.__version__, geopandas.__version__, shapely.__version__, duckdb.__version__)"'

      - name: Probe
        run: |
          mkdir -p out
          docker run --rm -v "$GITHUB_WORKSPACE/.github/diag:/diag:ro" -v "$GITHUB_WORKSPACE/out:/out" \
            -e CURIO_ISOLATION=off -e FLASK_USE_RELOADER=0 -e CURIO_LAUNCH_CWD=/app -w /app \
            "ghcr.io/urban-toolkit/curio-ci:${{ matrix.image }}" \
            python /diag/rerun_memory_probe.py --variant "${{ matrix.variant }}" --label "${{ matrix.label }}" \
              --samples "${{ matrix.samples || 3 }}" --cycles 10 ${{ matrix.diag || '' }} --replay-variant "${{ matrix.rv || '' }}" --out "/out/${{ matrix.label }}-${{ matrix.variant }}-${{ matrix.job }}.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: probe-${{ matrix.label }}-${{ matrix.variant }}-${{ matrix.job }}
          path: out
          retention-days: 7
