name: Autark schema

# Compares the vendored autk-grammar schema with the file its record,
# utk_curio/backend/app/agents/schemas/autk-grammar.v1.source.json, names, and
# fails on a difference: a release, fetched again from npm, or the autk-grammar
# tarball the frontend installs from utk_curio/frontend/urban-workflows/vendor/autark/,
# read in the checkout. The backend suite checks the copy against that record
# offline; only this job reaches npm.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/sync_autk_schema.py --check
