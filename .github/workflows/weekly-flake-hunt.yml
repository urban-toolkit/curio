name: Weekly flake hunt

# Every Saturday, the Full stack build on main with every test suite run ten
# times (its `repeat` input, scripts/ci_repeat.sh): its CI report lists every
# test that passed in one run and failed in another. It dispatches that run
# rather than adding a schedule inside docker-compose.yml, so the Saturday run
# is exactly the one a person starts from the Actions tab with repeat 10. A
# workflow_dispatch is the one event the repository's own token may start.
#
# Then `report` waits for the run it started and writes that week's report on
# this run's own page (scripts/ci_weekly_report.py): the run, its jobs, its CI
# report page, its flaky tests and its suite table. This run ends red when the
# Full stack build did not pass or found a flaky test.
#
# 3 AM in Chicago all year (GitHub reads the cron in the timezone below,
# daylight saving included), the quiet hours the Full stack build's own
# schedule uses. Run this by hand from the Actions tab to start the same run
# now.
on:
  schedule:
    - cron: '0 3 * * 6'
      timezone: 'America/Chicago'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      since: ${{ steps.start.outputs.since }}
    steps:
      - name: ▶️ Start the Full stack build on main with repeat 10
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run docker-compose.yml --repo "$GITHUB_REPOSITORY" --ref main -f repeat=10

  # The repeat-10 run takes about four hours (3.2 and 3.9 on 10-24 and 10-31),
  # and a GitHub-hosted job stops at six, so this waits on an arcade CPU runner,
  # which it holds while the run lasts and which pick-runners counts as busy.
  report:
    needs: dispatch
    runs-on: [self-hosted, arcade, cpu]
    timeout-minutes: 720
    permissions:
      actions: read
      contents: read
    steps:
      # A Full stack build job on this runner can leave root-owned files in the
      # workspace, which the checkout cannot remove, and a job's sparse checkout
      # stays in the workspace's .git/config for the next job's checkout. As the
      # stacks' reclaim step in docker-compose.yml, this hands the files back
      # and forgets the sparse checkout. The checkout itself is whole: a sparse
      # one here, on 11-07, cut every later job on arcade-cpu-05 back to this
      # one script.
      - name: 🧹 Reclaim root-owned files, forget a sparse checkout
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true
          if [ -d .git ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all core.sparseCheckoutCone || true
            rm -f .git/info/sparse-checkout || true
          fi

      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📋 Wait for the run and write the week's report
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ needs.dispatch.outputs.since }}
        run: python3 scripts/ci_weekly_report.py --since "$SINCE" --out "$GITHUB_STEP_SUMMARY"
