name: Flake hunt

# Runs the same tests on 10 or more Curio stacks at once, several times over,
# and reports every test that both passed and failed: the flakes CI meets now
# and then, found on purpose and with their evidence.
#
# Each lanes job takes one arcade CPU runner and starts stacks_per_runner
# stacks on it (scripts/ci_lanes.py), each a compose project with its own
# ports and its own git worktree. The runners wait for each other before the
# tests start, so every stack runs at the same time. The report job merges
# the runners' results (scripts/ci_flakes.py) into the run summary and
# flake-report.html, and fails when any test failed even once.
#
# Diagnostic only, never part of normal CI. It runs on a manual dispatch, or
# with the defaults below when a branch named flake/... is pushed. Dispatch
# needs this file on the default branch first:
#
#     git push origin HEAD:flake/<anything>
#
# CPU runners only: a stack and its Chromium take about 3 GiB, an arcade CPU
# runner has 32 GB and a hosted one 16, and the GPU runners belong to
# test-gpu. So the e2e tests here are e2e-desktop's half
# (CURIO_E2E_RUNNER=desktop); the WebGPU half needs a GPU runner per stack.
# There is no schedule: the hunt loads arcade, and arcade's load is a known
# cause of test-gpu failures in PR runs. There is no pull_request trigger
# either, so a fork never reaches these runners.
on:
  workflow_dispatch:
    inputs:
      runners:
        description: Arcade CPU runners
        default: "2"
      stacks_per_runner:
        description: Stacks on each runner, 1 to 8 (runners x stacks must be 10 or more)
        default: "5"
      iterations:
        description: Runs of the tests on each stack
        default: "3"
      suite:
        description: Suite
        type: choice
        options: [e2e, backend, sandbox]
        default: e2e
      tests:
        description: A pytest -k expression, run on every stack (empty = the whole suite, split over the stacks)
        default: ""
      workflows:
        description: e2e only, workflow files run on every stack (A.json,B.json)
        default: ""
  push:
    branches: ["flake/**"]

permissions:
  contents: read

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: false

# What scripts/ci_lanes.py reads; a push run takes the defaults.
env:
  FLAKE_RUNNERS: ${{ inputs.runners || '2' }}
  FLAKE_STACKS: ${{ inputs.stacks_per_runner || '5' }}
  FLAKE_ITERATIONS: ${{ inputs.iterations || '3' }}
  FLAKE_SUITE: ${{ inputs.suite || 'e2e' }}
  FLAKE_TESTS: ${{ inputs.tests }}
  FLAKE_WORKFLOWS: ${{ inputs.workflows }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
    steps:
      - name: 🧮 Check the inputs
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "$FLAKE_RUNNERS" =~ ^[0-9]+$ && "$FLAKE_STACKS" =~ ^[0-9]+$ && "$FLAKE_ITERATIONS" =~ ^[0-9]+$ ]] \
            || fail "runners, stacks_per_runner and iterations must be whole numbers"
          # About 3 GiB a stack on a 32 GB runner.
          (( FLAKE_STACKS >= 1 && FLAKE_STACKS <= 8 )) || fail "stacks_per_runner must be 1 to 8, not $FLAKE_STACKS"
          (( FLAKE_RUNNERS * FLAKE_STACKS >= 10 )) \
            || fail "runners x stacks_per_runner must be 10 or more, not $(( FLAKE_RUNNERS * FLAKE_STACKS ))"
          # The arcade CPU pool (CPU_RUNNERS in scripts/ci_pick_runners.py).
          (( FLAKE_RUNNERS >= 1 && FLAKE_RUNNERS <= 40 )) || fail "runners must be 1 to 40, not $FLAKE_RUNNERS"
          (( FLAKE_ITERATIONS >= 1 )) || fail "iterations must be at least 1"
          [[ -z "$FLAKE_WORKFLOWS" || "$FLAKE_SUITE" == e2e ]] || fail "workflows needs the e2e suite"
          echo "runners=$(jq -cn --argjson n "$FLAKE_RUNNERS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          {
            echo "Flake hunt: $(( FLAKE_RUNNERS * FLAKE_STACKS )) stacks ($FLAKE_RUNNERS runners x $FLAKE_STACKS)," \
                 "$FLAKE_ITERATIONS iterations of the $FLAKE_SUITE suite"
          } >> "$GITHUB_STEP_SUMMARY"

  # The image the Full stack build pushed for this commit when there is one,
  # built here otherwise (a flake/... branch has no Full stack build).
  image:
    needs: plan
    runs-on: [self-hosted, cpu]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: 🧹 Reclaim root-owned workspace files (self-hosted)
        run: docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true

      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/build-image
        id: build
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          reuse: "true"

  lanes:
    name: lanes ${{ matrix.runner }}
    needs: [plan, image]
    runs-on: [self-hosted, cpu]
    timeout-minutes: 300
    # actions: read is for the barrier, which watches the other lanes jobs.
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    env:
      FLAKE_RUNNER: ${{ matrix.runner }}
      FLAKE_IMAGE: ${{ needs.image.outputs.image }}
      FLAKE_OUT: ${{ github.workspace }}/flake-out
    steps:
      - name: 🧹 Reclaim root-owned workspace files (self-hosted)
        run: docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true

      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # scripts/test.sh installs these on every call. Once here, the lanes'
      # calls, several at a time into this one interpreter, find them in place.
      - name: 📦 Install the host-side e2e dependencies once
        if: env.FLAKE_SUITE == 'e2e'
        run: |
          pip install -r requirements.txt -q
          PYTHONPATH="$PWD" python curio.py setup
          python -m playwright install chromium

      # The barrier below finds this step by its name (START_STEP in ci_lanes.py).
      - name: ▶️ Start the stacks
        run: python scripts/ci_lanes.py start

      - name: ⏳ Wait for every runner's stacks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_lanes.py barrier

      - name: 🎭 Run the tests on every stack
        run: python scripts/ci_lanes.py run

      - name: 🧹 Stop the stacks
        if: always()
        run: python scripts/ci_lanes.py stop

      - name: 📤 Upload this runner's results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flake-lanes-${{ matrix.runner }}
          path: flake-out/
          if-no-files-found: ignore
          retention-days: 14

      - name: 🧹 Hand back root-owned files, remove old CI images
        if: always()
        run: bash scripts/ci_stack.sh handback

  report:
    needs: [plan, lanes]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: [self-hosted, cpu]
    timeout-minutes: 20
    steps:
      - name: 🧹 Reclaim root-owned workspace files (self-hosted)
        run: docker run --rm -v "$PWD:/w" -w /w alpine chown -R "$(id -u):$(id -g)" /w 2>/dev/null || true

      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The page transcodes screenshots to WebP when Pillow is there.
      - name: 📦 Install Pillow
        run: python -m pip install --quiet Pillow

      - name: 📥 Download every runner's results
        uses: actions/download-artifact@v7
        with:
          pattern: flake-lanes-*
          path: inputs

      - name: 🔎 Find the flakes
        id: flakes
        shell: bash
        run: |
          set +e
          python scripts/ci_flakes.py inputs --requested "$(( FLAKE_RUNNERS * FLAKE_STACKS ))" \
            --out flake-report.html --summary flake-summary.md --json flakes.json
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload the flake report page
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: flake-report.html
          archive: false
          if-no-files-found: ignore
          retention-days: 30

      - name: 📤 Upload the flake list
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flakes-json
          path: flakes.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 🔗 Put the verdict in the run summary
        if: always()
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            [ -z "$REPORT_URL" ] || echo "[Open flake-report.html]($REPORT_URL): every failure, where it happened, and a screenshot per failing test."
            echo
            cat flake-summary.md 2>/dev/null || echo "No flake summary was written; see the Find the flakes step."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚦 Fail on anything that failed
        if: steps.flakes.outputs.status != '0'
        run: |
          echo "::error::the flake hunt saw failures (or too few stacks at once); see the run summary" >&2
          exit 1
