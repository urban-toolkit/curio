[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utk-curio"
dynamic = ["version"]
description = "Curio: A dataflow-based framework for urban visual analytics"
authors = [{name = "UTK", email = "fabiom@uic.edu"}]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"

# Framework deps only. Data-ops libs (pandas, geopandas, etc.)
# live in each node package's manifest.dependencies.python and are
# pip-installed by the launcher at ``curio start`` — see
# ``packages/curio.builtin@1/manifest.json`` for the worked example.
dependencies = [
  "requests==2.33.1",
  "python-dotenv==1.2.2",
  "Flask==3.1.3",
  "Flask-Caching==2.4.0",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "openai==2.36.0",
  "anthropic>=0.100.0",
  "google-generativeai>=0.8.6",
  "altair>=6.1.0",
  "tqdm>=4.67.3",
  "pygments>=2.20.0",
  # Validates manifests and dataflow specs against docs/schemas/*.json.
  # See requirements.txt for why this is a floor and not an exact pin.
  "jsonschema>=4.18",
  "psutil>=5.9",
  "pyseccomp>=0.1.2; sys_platform == 'linux'",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-playwright==0.7.2",
  "pytest-xdist==3.8.0",
  "pytest-flask==1.3.0",
  "allure-pytest==2.16.0"
]

[project.scripts]
curio = "utk_curio.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# MANIFEST.in gets these into the sdist; this gets them into the wheel.
# "llm-prompts" is a data directory inside the utk_curio package rather than a
# package of its own (the hyphen makes it unimportable), so packages.find never
# sees it and it needs naming explicitly or the built-in agents ship promptless.
utk_curio = ["llm-prompts/*.txt"]

[tool.setuptools.dynamic]
version = {attr = "utk_curio.__version__"}

[tool.setuptools.packages.find]
where = ["."]



