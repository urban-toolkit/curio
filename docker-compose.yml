services:
  curio:
    build:
      context: .
      dockerfile: Dockerfile
    tty: true
    stdin_open: true
    environment:
      - PYTHONUNBUFFERED=1
      # Source is baked into the image, so auto-reload only causes restarts.
      - FLASK_USE_RELOADER=0
    ports:
      # Sandbox port 2000 runs user code, so it stays unpublished.
      - "5002:5002"
      - "8080:8080"
    volumes:
      # packages/ is not mounted: a catalog publish would rewrite the host checkout.
      - ./datasets:/app/datasets # published datasets
      - ./.curio:/app/.curio # sandbox data, read by Playwright on the host
      - ./instance:/app/instance # SQLite database: users, projects, sessions
