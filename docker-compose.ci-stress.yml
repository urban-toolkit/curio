# Compose override for the multi-user stress job
# (.github/workflows/docker-compose.yml, job `test-gpu-stress`).
#
# This stack is the deployment shape -- --deploy, fork isolation, the
# curio-exec account -- because the numbers are only worth reading if they come
# from what users actually run against. It is docker-compose.ci-exec-user.yml
# with two differences, both required by the harness rather than by the
# configuration under test:
#
# 1. --testing. The browser tier creates its users through
#    /api/testing/stub-login, which is mounted only in a non-production
#    environment AND with this set (backend/app/testing/routes.py). The HTTP
#    tiers do not need it -- they use the real /api/auth/signup, the same call
#    the signup form makes -- so dropping this variable would cost the browser
#    tier, not the load itself.
#
# 2. The frontend port is published. The browser tier drives real pages.
#
# Execution limits are left at their defaults on purpose: CURIO_EXEC_MEMORY_MB
# (4096), CURIO_EXEC_TIMEOUT (300) and CURIO_EXEC_PARALLELISM are what a
# deployment runs with, and a tier that queues behind them is reporting
# something true. Raise them in a dispatch run to measure a different shape,
# never to make a red tier green.
#
# Parallelism has no fixed number to quote here, and that is the point: it is
# derived from the host (half the cores, half the visible memory over the
# per-node budget, what pids_limit below can carry, floor 2, ceiling 32). On
# the utk runner that is 32. Anyone reading a stress report has to know which
# count produced it, so the harness records the effective value in the report
# header rather than the reader inferring it from this file.
#
# A sixth port triple. The runner shares its host with prod curio
# (2000/5002/8080), curio-dev (2010/5012/8090), the in-process CI stack
# (2020/5022/8100), the isolated one (2030/5032/8110) and the exec-user one
# (2040/5042/8120), so this takes 2070/5072/8150 and its own compose project
# (-p curio-ci-stress). 2050 and 2060 belong to the two dispatch-only repro
# workflows.
services:
  curio:
    # Node subprocesses for the Autark data loads are capped by the sandbox's
    # own semaphore now (worker._default_js_parallelism, 16 on this runner),
    # so 100 users no longer means 100 process trees at once. This limit is
    # still one of the things the run measures the distance to: the 100-user
    # tier peaked at 1313 PIDs.
    #
    # Raised from 4096 because the number is now load-bearing rather than
    # protective. The isolated pool's default count is capped at what half the
    # PID ceiling can carry at 256 processes each, so 4096 would pin this
    # stack to 8 concurrent nodes and the job would report a shape no
    # deployment of this size runs. 32768 carries the ceiling of 32 with room
    # for the backend, the sandbox, the zygote and the Node pool, and is still
    # a bound: a fork bomb hits it long before it hits the host's pid_max.
    pids_limit: 32768
    environment:
      - CURIO_SANDBOX_TOKEN=${CURIO_SANDBOX_TOKEN:?CURIO_SANDBOX_TOKEN must be set for the CI overlay}
      # Pinned, not inferred: a runner that cannot confine must fail the job
      # rather than quietly run every user's node code in one process, which
      # would measure a stack nobody deploys.
      - CURIO_ISOLATION=fork
    ports:
      - "127.0.0.1:${CURIO_PORT_2000:-2070}:2000"
    command:
      - python
      - curio.py
      - start
      - all
      - --deploy
      - --testing
      - --with-examples
      - --backend-host
      - 0.0.0.0
      - --backend-port
      - "5002"
      - --sandbox-host
      - 0.0.0.0
      - --sandbox-port
      - "2000"
