# Compose override used only by the CI test workflow
# (.github/workflows/docker-compose.yml).
#
# CI-specific adjustments to the image and its default CMD:
#
# 1. --deploy. The default CMD carries no auth flag, which resolves to
#    CURIO_NO_AUTH=1 (see utk_curio/cli/environment.py). The e2e suite then skips every
#    test that needs a real logged-in owner via require_user_auth() -- around
#    26 of them, including the whole package roundtrip, data catalog and node
#    catalog suites. This matches what the pytest-owned harness already does
#    for itself (fixtures.py appends --deploy for exactly this reason); only the
#    --use-existing CI path was missing it.
#
# 2. umask 000. The e2e suite runs Playwright on the HOST (as the runner user
#    `deploy`) against the containerized stack, and several tests clean up the
#    per-user store directly on the bind-mounted workspace -- e.g.
#    .curio/users/<id>/installed-libraries.json in test_library_manager_e2e's
#    library_teardown. The container runs as root, so anything it creates
#    mid-run is root-owned 755/644 and the host process cannot unlink inside
#    it (PermissionError [Errno 13]). The workflow's pre-run
#    `chmod -R a+rwx .curio` cannot cover paths that do not exist yet, so
#    widen the container's creation mask instead. umask is inherited by the
#    backend/sandbox/frontend children curio.py spawns. `exec` keeps python as
#    PID 1 so `docker compose down` still signals it directly.
#
# 3. The sandbox is reachable from the host. The image default keeps the
#    sandbox on 127.0.0.1 inside the container and publishes no port for it,
#    because it executes arbitrary user code and only the backend needs to
#    reach it. CI is the one context that genuinely needs more: Playwright
#    runs on the HOST and test_alive.py / test_library_install_integration.py
#    call the sandbox directly. So this overlay -- and only this overlay --
#    binds it to 0.0.0.0 and publishes it to the host's loopback (never
#    0.0.0.0, so it stays off the runner's network). CURIO_SANDBOX_TOKEN is
#    pinned to a known value so the host-side pytest can authenticate; the
#    workflow exports the same value into the pytest environment.
#
# 4. Nothing installs at boot. The image is CI's (CURIO_CI_SETUP below), which
#    holds everything `curio.py setup --with-examples` installs, so the stack
#    starts with CURIO_SKIP_DEP_INSTALL=1: the launcher runs no pip over
#    requirements.txt and the package manifests, and no npm install of the
#    sandbox's packages. test-gpu builds the image through this file; the
#    other jobs pull the one build-image built with the same argument. Every
#    CI overlay sets both.
#
# Deliberately NOT docker-compose.deploy.yml: that overlay also passes
# --no-allow-publish, which would disable the two catalog mutators that the
# publish-catalog tests exercise. CI wants auth on and publish still allowed.
services:
  curio:
    build:
      args:
        CURIO_CI_SETUP: "1"
    # Process-count cap for the isolation test suite.
    #
    # test_isolation_linux.py can provoke process exhaustion, and inside
    # the container those tests run as root, which bypasses RLIMIT_NPROC.
    # This runner shares a host with the live curio and curio-dev stacks,
    # so bound the container rather than trusting the code under test.
    #
    pids_limit: 4096
    # A memory limit sized to the runner, on self-hosted runners only
    # (scripts/ci_memory_budget.py writes CURIO_CI_MEM_LIMIT; unset, 0 is no
    # limit). Without one, a stack that outgrew a 12 GB desktop swapped the
    # machine until its runner stopped answering GitHub and the job was lost.
    # With it, the kernel kills a process in this container and the job
    # fails saying so. memswap_limit is the same value, so the container
    # cannot swap: a fixed 12g limit without it (an earlier try) let the
    # container swap, and test_node_execution[06-back-bay-road-sunlight],
    # which parses city-scale PBFs, timed out on the slowdown. The limit is
    # everything the runner has free less a reserve, so it does not squeeze
    # the stack; on a small runner test-gpu runs fewer workers instead.
    mem_limit: ${CURIO_CI_MEM_LIMIT:-0}
    memswap_limit: ${CURIO_CI_MEM_LIMIT:-0}
    environment:
      - CURIO_SANDBOX_TOKEN=${CURIO_SANDBOX_TOKEN:?CURIO_SANDBOX_TOKEN must be set for the CI overlay}
      # This is the UNISOLATED baseline stack, which only --testing on the
      # command makes bootable: --deploy refuses to start unisolated
      # anywhere else.
      # --deploy now turns isolation on
      # wherever the host can deliver it, and this container runs as root in an
      # image that carries curio-exec, so the launcher would otherwise discover
      # it and quietly switch the main e2e suite onto the fork path.
      # docker-compose.ci-isolated.yml and docker-compose.ci-exec-user.yml are
      # the stacks that cover isolation; this one must stay in-process.
      - CURIO_ISOLATION=off
      # ``--testing`` on the command below is what mounts /api/testing/*
      # (stub-login, stub-project, reset-db) and the scripted LLM provider,
      # both of which the host-side e2e suite drives. A stack started without
      # it answers 404 -- which surfaces as every e2e test erroring in the
      # autouse e2e_clean_db fixture, not as one legible failure. It is also
      # what lets this stack run --deploy unisolated at all.
      # Pin what --testing resolves against rather than leaning on the
      # child process's cwd: the test DB then lands at /app/.curio/test/,
      # which is the bind-mounted workspace the host-side suite already
      # resolves for itself (test_db_paths).
      - CURIO_LAUNCH_CWD=/app
      # The Discovery Catalog's recorded portal corpus. The host-side e2e specs
      # drive this container with --use-existing, so it is the CONTAINER that
      # needs this, not the pytest process: without it the discovery transport falls
      # back to real HTTP and those specs would reach live portals. Honoured
      # only alongside --testing on the command below, which is what sets
      # CURIO_TESTING (see discovery/infrastructure/transport.py).
      - CURIO_DISCOVERY_FIXTURES=/app/utk_curio/backend/tests/test_discovery/fixtures
      # See 4 above.
      - CURIO_SKIP_DEP_INSTALL=1
    # The job's own host ports, in place of the base file's 5002/8080, which
    # are the production stack's on the runner.
    ports: !override
      - "${CURIO_E2E_BACKEND_PORT:?this job's host port for the backend}:5002"
      - "${CURIO_E2E_FRONTEND_PORT:?this job's host port for the web app}:8080"
      - "127.0.0.1:${CURIO_E2E_SANDBOX_PORT:-2000}:2000"
    command:
      - sh
      - -c
      - >-
        umask 000 && exec python curio.py start all --deploy --testing --with-examples
        --backend-host 0.0.0.0 --backend-port 5002 --backend-url "${CURIO_E2E_BACKEND_URL:?the host address of this stack's backend}"
        --sandbox-host 0.0.0.0 --sandbox-port 2000
