# Compose override for the exec-user CI job
# (.github/workflows/docker-compose.yml, job `test-gpu-exec-user`).
#
# This is the ONLY job that boots the configuration the deploy actually ships:
# `--isolation fork --exec-user curio-exec` with auth on, byte-for-byte the
# flags in docker-compose.deploy.yml. Everything else about isolation is
# tested either as a unit (test_isolation_linux.py, against a workspace the
# test builds itself) or with children running as root
# (docker-compose.ci-isolated.yml), and root ignores mode bits -- so the whole
# permissions half of the boundary was unexercised end to end. Two of the five
# defects found on this branch lived exactly there and were invisible to CI.
#
# Deliberate differences from docker-compose.ci-isolated.yml, each forced.
#
# 1. --exec-user, and therefore NO host-side e2e. Setting it makes the sandbox
#    chmod ./instance and ./.curio/data to 0700/0600 root-owned at boot. The
#    e2e harness computes its ground truth by executing every code node IN THE
#    HOST TEST PROCESS (test_frontend/utils.py::execute_workflow_programmatically)
#    and writing the artifacts into .curio/data as the runner user, so it dies
#    with EACCES before a browser is ever driven. The two are mutually
#    exclusive. This job therefore drops the workflow comparison entirely and
#    asserts the boundary over the sandbox's HTTP API instead
#    (utk_curio/sandbox/tests/live/test_exec_user_boundary.py), which runs
#    nothing on the host that touches the hardened paths.
#
# 2. --auth, which ci-isolated.yml had to drop. A hosted instance asking for
#    fork isolation without an exec user is fatal by design
#    (isolation/hardening.py::apply_and_report). With one, that combination is
#    the supported deployment shape, so this job can run it -- and the boot
#    itself becomes an assertion: fail-closed means a stack that cannot confine
#    exits rather than serve, so the health gate below catches it.
#
# 3. NO umask 000. The other two CI overlays widen the creation mask because
#    host-side Playwright writes into the bind-mounted .curio. Nothing on the
#    host writes there in this job, and widening the mask would loosen the very
#    modes under test. The workflow reclaims ownership of the workspace through
#    a root container before checkout and after teardown, which is what the
#    isolated job already does for the same reason.
#
# 4. A fifth port triple. The runner shares its host with prod curio
#    (2000/5002/8080), curio-dev (2010/5012/8090), the in-process CI stack
#    (2020/5022/8100) and the isolated one (2030/5032/8110), so this takes
#    2040/5042/8120 and its own compose project (-p curio-ci-exec-user).
services:
  curio:
    # Same reasoning as the other two CI overlays: the isolation paths can
    # provoke process exhaustion and this host also runs the live stacks.
    # RLIMIT_NPROC bounds each child, but the sandbox parent is root here.
    pids_limit: 4096
    environment:
      - CURIO_SANDBOX_TOKEN=${CURIO_SANDBOX_TOKEN:?CURIO_SANDBOX_TOKEN must be set for the CI overlay}
    ports:
      # The sandbox, published to the runner's loopback only (never 0.0.0.0).
      # The boundary assertions are host-side pytest calling /exec directly,
      # which is the same reason docker-compose.ci.yml publishes it.
      - "127.0.0.1:${CURIO_PORT_2000:-2040}:2000"
    command:
      - python
      - curio.py
      - start
      - all
      - --auth
      - --with-examples
      - --backend-host
      - 0.0.0.0
      - --backend-port
      - "5002"
      # Published above, so unlike the deploy overlay the sandbox has to listen
      # on more than loopback-inside-the-container.
      - --sandbox-host
      - 0.0.0.0
      - --sandbox-port
      - "2000"
      # The two flags this whole job exists to exercise. Kept identical to
      # docker-compose.deploy.yml; if that pair changes there, change it here.
      - --isolation
      - fork
      - --exec-user
      - curio-exec
